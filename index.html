
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventory Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Smart Inventory Management System</h1>
    <p>Welcome to your Inventory Dashboard!</p>

    <hr>

    <h2>Dashboard Overview</h2>

    <h3>Total Products: 0</h3>
    <h3>Available Stock: 0</h3>
    <h3>Low Stock Alerts: 0</h3>
    <h3>Total Sales: Rs. 0</h3>

    <hr>

    <h2>Inventory Management</h2>

    <button>Add Product</button>
    <button>View Products</button>
    <button>Sales Report</button>

    <h2>Product List</h2>

    <table border="1">
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Laptop</td>
            <td>50000</td>
            <td>10</td>
        </tr>
    </table>

</body>
</html>
